name: Lumen
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    # Replaced with the real Apple Team ID when building for TestFlight.
    DEVELOPMENT_TEAM: LUMENDEV00
    LUMEN_BUNDLE_ID: com.$(DEVELOPMENT_TEAM).lumen
    LUMEN_KEYCHAIN_GROUP: $(AppIdentifierPrefix)com.$(DEVELOPMENT_TEAM).lumen.shared
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Lumen:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared/Core
      - path: Shared/Intents
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Lumen
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.lifestyle
        LumenKeychainGroup: $(LUMEN_KEYCHAIN_GROUP)
        NSLocalNetworkUsageDescription: Lumen talks to your WiZ lights directly over your home Wi-Fi, so they respond instantly without going through the internet.
        NSSupportsLiveActivities: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes:
              - lumen
    entitlements:
      path: App/Lumen.entitlements
      properties:
        keychain-access-groups:
          - $(LUMEN_KEYCHAIN_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LUMEN_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) LUMEN_APP
    dependencies:
      - target: LumenWidget
        embed: true
        codeSign: true

  LumenWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared/Core
      - path: Shared/Intents
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Lumen
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LumenKeychainGroup: $(LUMEN_KEYCHAIN_GROUP)
        NSLocalNetworkUsageDescription: Lumen talks to your WiZ lights directly over your home Wi-Fi.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/LumenWidget.entitlements
      properties:
        keychain-access-groups:
          - $(LUMEN_KEYCHAIN_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LUMEN_BUNDLE_ID).Widget
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES

schemes:
  Lumen:
    build:
      targets:
        Lumen: all
    run:
      config: Debug
    archive:
      config: Release
